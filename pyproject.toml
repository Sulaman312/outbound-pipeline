[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outbound"
version = "0.1.0"
description = "Arsuno outbound pipeline: source, enrich, verify, send, report"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
outbound = "outbound.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",   # line length is the formatter's job
    "UP042",  # keep (str, Enum): StrEnum changes str() output
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]  # small lambdas as test fixtures are fine

[tool.ruff.lint.isort]
known-first-party = ["outbound", "tests"]
