# Monthly hard caps. The code stops before going over them.
# Apollo charges 1 credit per page of up to 100 companies, so 50 credits = up to 5,000 companies.
# Raise only when you mean to spend more.
caps:
  apollo:
    credits: 50
  # Google Places Text Search: 1 request per page of up to 20 places. The first 1,000 a month
  # are free (Text Search Enterprise, checked 2026-10-16; see docs/research.md).
  google_places:
    requests: 1000
