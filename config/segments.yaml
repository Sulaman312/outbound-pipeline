# Who we look for. One block per segment. Edit freely; the code checks the format.
#
#   offer:       ai_automation or frontend (which campaign these companies are for)
#   description: one line for humans
#   employees:   Apollo headcount ranges written "min,max"
#   locations:   where the company is headquartered
#   keywords:    Apollo company keywords; a company matches if it has any of them
#
# These are starting points to test, not final choices.

