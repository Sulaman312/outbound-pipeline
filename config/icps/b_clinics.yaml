# ICP B (Section 1 playbook, draft, wave 2): private clinics, AI intake.
id: B
name: Private clinics
offer: AI intake assistant and 24/7 booking chat
countries: [US, UK, AU]

disqualify:
  max_employees: 50
  name_keywords: [hospital, nhs, trust, university]

sources:
  google_places:
    enabled: false               # wave 2; turn on when clinics launch
    queries: [psychiatry clinic, psychology practice, physiotherapy clinic, dental clinic, dermatology clinic, med spa]
    cities:
      US: [Austin TX, Denver CO]
      UK: [London, Manchester]
      AU: [Sydney, Melbourne]
    max_pages: 1
