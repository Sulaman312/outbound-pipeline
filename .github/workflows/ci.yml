name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: outbound
          POSTGRES_PASSWORD: outbound
          POSTGRES_DB: outbound
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U outbound -d outbound"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: pytest (SQLite)
        run: pytest
      - name: pytest (Postgres)
        env:
          DATABASE_URL: postgresql+psycopg://outbound:outbound@localhost:5432/outbound
          OUTBOUND_TEST_POSTGRES: "1"
        run: pytest
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
